---
name: build
on:
  push:
    tags:
      - 'openvpn-v*.*.*'
  workflow_dispatch:
    inputs:
      openvpn_version:
        description: 'OpenVPN version to build, e.g. v2.7.8 (needs openvpn-<version>-aws.patch)'
        required: true
        type: string
jobs:
  build:
    # https://github.com/OpenVPN/openvpn/blob/master/.github/workflows/build.yaml#L132
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          sudo apt-get update && sudo apt-get install -y
          liblzo2-dev libpam0g-dev liblz4-dev libnl-genl-3-dev linux-libc-dev man2html
          libcmocka-dev libcap-ng-dev python3-docutils libtool automake autoconf golang

      # Manual run: the openvpn_version input. Tag push: openvpn-vX.Y.Z builds vX.Y.Z.
      - name: Set OpenVPN version
        env:
          VERSION: ${{ inputs.openvpn_version || github.ref_name }}
        run: |
          version="${VERSION#openvpn-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid OpenVPN version: '$version'" >&2
            exit 1
          fi
          echo "OPENVPN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout OpenVPN
        uses: actions/checkout@v7
        with:
          repository: OpenVPN/openvpn
          ref: ${{ env.OPENVPN_VERSION }}
          path: openvpn

      - name: Checkout aws-vpn-client
        uses: actions/checkout@v7
        with:
          path: aws-vpn-client

      - name: Patch OpenVPN
        run: git -C openvpn apply "../aws-vpn-client/openvpn-${OPENVPN_VERSION}-aws.patch"

      - name: autoconf
        run: autoreconf -fvi
        working-directory: openvpn

      - name: configure build
        run: ./configure
        working-directory: openvpn

      - name: build OpenVPN
        run: make -j 2
        working-directory: openvpn

      - name: build SAMLserver
        run: go build -o SAMLserver server.go
        working-directory: aws-vpn-client

      - name: release
        run: >
          mkdir release &&
          cp
          aws-vpn-client/SAMLserver
          aws-vpn-client/vpn.conf
          aws-vpn-client/domains.txt
          aws-vpn-client/aws-connect.sh
          aws-vpn-client/resolvconf.sh
          openvpn/src/openvpn/openvpn
          release &&
          chmod +x
          release/SAMLserver
          release/aws-connect.sh
          release/openvpn
          release/resolvconf.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aws-vpn-client
          path: release
