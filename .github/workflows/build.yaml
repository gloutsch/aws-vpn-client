---
name: build
on:
  push:
    tags:
      - 'openvpn-v*.*.*'
  workflow_dispatch:
    inputs:
      openvpn_version:
        description: 'OpenVPN version to build, e.g. v2.7.8 (needs openvpn-<version>-aws.patch)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # https://github.com/OpenVPN/openvpn/blob/master/.github/workflows/build.yaml#L132
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          sudo apt-get update && sudo apt-get install -y
          liblzo2-dev libpam0g-dev liblz4-dev libnl-genl-3-dev linux-libc-dev man2html
          libcmocka-dev libcap-ng-dev python3-docutils libtool automake autoconf golang

      # Manual run: the openvpn_version input. Tag push: openvpn-vX.Y.Z builds vX.Y.Z.
      - name: Set OpenVPN version
        env:
          VERSION: ${{ inputs.openvpn_version || github.ref_name }}
        run: |
          version="${VERSION#openvpn-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid OpenVPN version: '$version'" >&2
            exit 1
          fi
          echo "OPENVPN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout OpenVPN
        uses: actions/checkout@v7
        with:
          repository: OpenVPN/openvpn
          ref: ${{ env.OPENVPN_VERSION }}
          path: openvpn

      - name: Checkout aws-vpn-client
        uses: actions/checkout@v7
        with:
          path: aws-vpn-client

      - name: Patch OpenVPN
        run: git -C openvpn apply "../aws-vpn-client/openvpn-${OPENVPN_VERSION}-aws.patch"

      - name: autoconf
        run: autoreconf -fvi
        working-directory: openvpn

      - name: configure build
        run: ./configure
        working-directory: openvpn

      - name: build OpenVPN
        run: make -j 2
        working-directory: openvpn

      - name: build SAMLserver
        run: go build -o SAMLserver server.go
        working-directory: aws-vpn-client

      # A tarball keeps the executable bits, which a zipped artifact drops.
      - name: package
        run: |
          name="aws-vpn-client-${OPENVPN_VERSION}-linux-x86_64"
          mkdir "$name"
          cp aws-vpn-client/{SAMLserver,vpn.conf,domains.txt,aws-connect.sh,resolvconf.sh} \
            openvpn/src/openvpn/openvpn "$name"
          chmod +x "$name"/{SAMLserver,aws-connect.sh,resolvconf.sh,openvpn}
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          version_line="$(openvpn/src/openvpn/openvpn --version | head -n1)"
          [[ -n "$version_line" ]] || { echo "openvpn --version printed nothing" >&2; exit 1; }
          {
            echo "$version_line"
            echo
            echo "Patched with \`openvpn-${OPENVPN_VERSION}-aws.patch\`. Built on \`ubuntu-latest\`, so it needs a compatible glibc and the shared libraries lzo2, lz4, libnl-genl-3, libcap-ng and OpenSSL; build from source on other distributions."
            echo
            echo "Verify the download with \`sha256sum -c $name.tar.gz.sha256\`."
          } > release-notes.md

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aws-vpn-client
          path: |
            aws-vpn-client-*.tar.gz
            aws-vpn-client-*.tar.gz.sha256
            release-notes.md
          if-no-files-found: error

  # Tag pushes publish the build as a GitHub release; manual runs only keep the artifact.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          name: aws-vpn-client

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber aws-vpn-client-*.tar.gz aws-vpn-client-*.tar.gz.sha256
          else
            gh release create "$TAG" --verify-tag --title "OpenVPN ${TAG#openvpn-} with AWS patch" \
              --notes-file release-notes.md --generate-notes \
              aws-vpn-client-*.tar.gz aws-vpn-client-*.tar.gz.sha256
          fi
