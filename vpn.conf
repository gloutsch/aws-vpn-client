# This is a sample configuration.
# Replace the contents of this file with the settings from your AWS Client VPN .ovpn file.
# 
# Make sure to REMOVE the following directives from your AWS file if they exist
# to prevent conflicts with the aws-connect.sh wrapper:
# - auth-user-pass
# - auth-federate
# - auth-retry interact
# - remote
# - remote-random-hostname
# - persist-key (deprecated in modern OpenVPN)

client
dev tun
nobind
persist-tun
remote-cert-tls server

# Modern OpenVPN (2.6+) prefers data-ciphers over the deprecated cipher directive
data-ciphers AES-256-GCM
data-ciphers-fallback AES-256-GCM

# Prevent renegotiation drop-outs on AWS
reneg-sec 0

# Ensure OpenVPN keeps trying to resolve the hostname if network drops
resolv-retry infinite

# Fail fast if authentication expires, preventing infinite restart loops
auth-retry none

# DNS configuration scripts
up ./resolvconf.sh
down ./resolvconf.sh

tun-mtu 1340
